    <style>
        /* CSS Variables for Terms Page */
        :root {
            --primary-blue: #1a365d;
            --light-blue: #3182ce;
            --white: #ffffff;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --success-color: #10b981;
            --error-color: #ef4444;
            --font-primary: 'Playfair Display', serif;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition-normal: all 0.3s ease;
        }

        /* Terms and Conditions Specific Styles */
        .terms-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .terms-header {
            text-align: center;
            margin-bottom: 3rem;
            padding: 2rem 0;
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            color: var(--white);
            border-radius: 12px;
        }

        .terms-header h1 {
            font-family: var(--font-primary);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .terms-header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .terms-tabs {
            display: flex;
            margin-bottom: 2rem;
            background: var(--white);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-md);
        }

        .tab-button {
            flex: 1;
            padding: 1.5rem 2rem;
            background: var(--gray-100);
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--gray-700);
            transition: var(--transition-normal);
            position: relative;
        }

        .tab-button.active {
            background: var(--primary-blue);
            color: var(--white);
        }

        .tab-button:hover:not(.active) {
            background: var(--gray-200);
        }

        .tab-button i {
            margin-right: 0.5rem;
        }

        .terms-content {
            background: var(--white);
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .tab-panel {
            display: none;
            padding: 3rem;
            min-height: 400px;
        }

        .tab-panel.active {
            display: block;
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            color: var(--gray-600);
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid var(--gray-200);
            border-top: 4px solid var(--primary-blue);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            color: var(--error-color);
            text-align: center;
        }

        .error-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            color: var(--error-color);
        }

        .retry-button {
            margin-top: 1rem;
            padding: 0.75rem 1.5rem;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition-normal);
        }

        .retry-button:hover {
            background: var(--light-blue);
        }

        .terms-rich-content {
            line-height: 1.7;
            color: var(--gray-800);
        }

        .terms-rich-content h1,
        .terms-rich-content h2,
        .terms-rich-content h3,
        .terms-rich-content h4,
        .terms-rich-content h5,
        .terms-rich-content h6 {
            color: var(--primary-blue);
            margin: 2rem 0 1rem 0;
            font-family: var(--font-primary);
        }

        .terms-rich-content h1 { font-size: 2rem; }
        .terms-rich-content h2 { font-size: 1.75rem; }
        .terms-rich-content h3 { font-size: 1.5rem; }
        .terms-rich-content h4 { font-size: 1.25rem; }

        .terms-rich-content p {
            margin: 1rem 0;
        }

        .terms-rich-content ul,
        .terms-rich-content ol {
            margin: 1rem 0;
            padding-left: 2rem;
        }

        .terms-rich-content li {
            margin: 0.5rem 0;
        }

        .terms-rich-content strong {
            color: var(--primary-blue);
            font-weight: 600;
        }

        .terms-rich-content em {
            color: var(--gray-600);
        }

        .terms-rich-content blockquote {
            border-left: 4px solid var(--light-blue);
            padding: 1rem 2rem;
            margin: 2rem 0;
            background: var(--gray-50);
            border-radius: 0 8px 8px 0;
        }

        .terms-rich-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
        }

        .terms-rich-content th,
        .terms-rich-content td {
            padding: 1rem;
            border: 1px solid var(--gray-200);
            text-align: left;
        }

        .terms-rich-content th {
            background: var(--gray-100);
            font-weight: 600;
            color: var(--primary-blue);
        }

        .terms-metadata {
            padding: 1.5rem;
            background: var(--gray-50);
            border-top: 1px solid var(--gray-200);
            font-size: 0.9rem;
            color: var(--gray-600);
        }

        .back-to-home {
            display: inline-flex;
            align-items: center;
            padding: 1rem 2rem;
            background: var(--light-blue);
            color: var(--white);
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 2rem;
            transition: var(--transition-normal);
        }

        .back-to-home:hover {
            background: var(--primary-blue);
            transform: translateX(-5px);
        }

        .back-to-home i {
            margin-right: 0.5rem;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .terms-container {
                padding: 1rem;
            }

            .terms-header h1 {
                font-size: 2rem;
            }

            .terms-tabs {
                flex-direction: column;
            }

            .tab-button {
                padding: 1rem;
                border-bottom: 1px solid var(--gray-200);
            }

            .tab-button:last-child {
                border-bottom: none;
            }

            .tab-panel {
                padding: 2rem 1.5rem;
            }

            .terms-rich-content h1 { font-size: 1.75rem; }
            .terms-rich-content h2 { font-size: 1.5rem; }
            .terms-rich-content h3 { font-size: 1.25rem; }
        }
    </style>
</head>

    <!-- Firebase Config Script - Load first -->
    <script src="assets/js/firebase-config.js"></script>
    
    <!-- Terms Manager Script -->
    <script>
        class TermsManager {
            constructor() {
                this.termsCache = new Map();
                this.currentCategory = 'user';
                this.initialized = false;
                this.retryCount = 0;
                this.maxRetries = 3;
            }

            async initialize() {
                try {
                    // Wait for Firebase to be ready
                    await this.waitForFirebase();
                    
                    this.initialized = true;
                    console.log('Terms Manager initialized successfully');

                    // Setup tab switching
                    this.setupTabSwitching();

                    // Load initial content
                    await this.loadTermsForCategory('user');
                    
                } catch (error) {
                    console.error('Failed to initialize Terms Manager:', error);
                    this.showError('user', 'Failed to initialize. Loading demo content.');
                    this.loadDemoTerms('user');
                }
            }

            async waitForFirebase() {
                return new Promise((resolve, reject) => {
                    let attempts = 0;
                    const maxAttempts = 100; // 10 seconds max wait (increased from 5)
                    
                    const checkFirebase = () => {
                        attempts++;
                        
                        // Check if Firebase is properly initialized
                        if (window.isFirebaseInitialized && window.isFirebaseInitialized()) {
                            const db = window.getFirebaseDB();
                            if (db && !window.FIREBASE_OFFLINE_MODE) {
                                console.log('Firebase ready for Terms Manager');
                                resolve(db);
                                return;
                            }
                        }
                        
                        // Also check if getFirebaseDB is available even if not fully initialized
                        if (window.getFirebaseDB && typeof window.getFirebaseDB === 'function') {
                            const db = window.getFirebaseDB();
                            if (db && db.collection) {
                                console.log('Firebase ready for Terms Manager (direct check)');
                                resolve(db);
                                return;
                            }
                        }
                        
                        if (attempts >= maxAttempts) {
                            console.warn('Firebase not ready after max attempts, using demo mode');
                            resolve(null);
                            return;
                        }
                        
                        setTimeout(checkFirebase, 100);
                    };
                    
                    checkFirebase();
                });
            }

            setupTabSwitching() {
                const tabButtons = document.querySelectorAll('.tab-button');
                const tabPanels = document.querySelectorAll('.tab-panel');

                tabButtons.forEach(button => {
                    button.addEventListener('click', async () => {
                        const category = button.dataset.category;
                        
                        // Update active states
                        tabButtons.forEach(btn => btn.classList.remove('active'));
                        tabPanels.forEach(panel => panel.classList.remove('active'));
                        
                        button.classList.add('active');
                        document.getElementById(`${category}-panel`).classList.add('active');
                        
                        this.currentCategory = category;
                        
                        // Load terms for this category if not cached
                        if (!this.termsCache.has(category)) {
                            await this.loadTermsForCategory(category);
                        }
                    });
                });
            }

            async loadTermsForCategory(category) {
                const panel = document.getElementById(`${category}-panel`);
                this.showLoading(panel);

                try {
                    // Get Firebase database
                    const db = window.getFirebaseDB();
                    
                    if (!db || window.FIREBASE_OFFLINE_MODE) {
                        console.log('Firebase not available, loading demo content');
                        this.loadDemoTerms(category);
                        return;
                    }

                    // Query Firestore using existing framework
                    console.log(`Loading ${category} terms from Firebase...`);
                    
                    const termsRef = db.collection('terms_and_conditions');
                    const querySnapshot = await termsRef
                        .where('category', '==', category)
                        .where('isActive', '==', true)
                        .orderBy('createdAt', 'desc')
                        .limit(1)
                        .get();
                    
                    if (querySnapshot.empty) {
                        console.log(`No active ${category} terms found, showing demo content`);
                        this.loadDemoTerms(category);
                        return;
                    }

                    // Get the first (most recent) active document
                    const termsDoc = querySnapshot.docs[0];
                    const termsData = { 
                        id: termsDoc.id, 
                        ...termsDoc.data() 
                    };

                    console.log(`Loaded ${category} terms:`, termsData);

                    // Cache the result
                    this.termsCache.set(category, termsData);

                    // Display the terms
                    this.displayTerms(category, termsData);

                } catch (error) {
                    console.error(`Failed to load ${category} terms:`, error);
                    this.retryCount++;
                    
                    if (this.retryCount < this.maxRetries) {
                        console.log(`Retrying... (${this.retryCount}/${this.maxRetries})`);
                        setTimeout(() => this.loadTermsForCategory(category), 2000);
                    } else {
                        console.log('Max retries reached, showing demo content');
                        this.loadDemoTerms(category);
                    }
                }
            }

            loadDemoTerms(category) {
                const demoTerms = {
                    user: {
                        id: 'demo-user-terms',
                        category: 'user',
                        content: `
                            <h2>User Terms and Conditions</h2>
                            <p><em>Demo content - Configure Firebase to load actual terms</em></p>
                            
                            <h3>1. Acceptance of Terms</h3>
                            <p>By accessing and using Roopam Jewellery's services, you accept and agree to be bound by the terms and provisions of this agreement.</p>
                            
                            <h3>2. User Accounts</h3>
                            <p>Users are responsible for maintaining the confidentiality of their account information and for all activities under their account.</p>
                            
                            <h3>3. Prohibited Uses</h3>
                            <ul>
                                <li>Violating any applicable laws or regulations</li>
                                <li>Transmitting harmful or malicious code</li>
                                <li>Attempting to gain unauthorized access</li>
                                <li>Harassment or abuse of other users</li>
                                <li>Using our services for fraudulent purposes</li>
                            </ul>
                            
                            <h3>4. Privacy and Data Protection</h3>
                            <p>Your privacy is important to us. Please review our Privacy Policy to understand how we collect, use, and protect your information.</p>
                            
                            <h3>5. Intellectual Property</h3>
                            <p>All content, including but not limited to text, graphics, logos, and images, is the property of Roopam Jewellery and is protected by intellectual property laws.</p>
                            
                            <h3>6. Limitation of Liability</h3>
                            <p>Our liability is limited to the maximum extent permitted by law. We are not responsible for any indirect or consequential damages.</p>
                        `,
                        isActive: true,
                        createdAt: new Date(),
                        createdBy: 'System Administrator'
                    },
                    plan: {
                        id: 'demo-plan-terms',
                        category: 'plan',
                        content: `
                            <h2>Plan Terms and Conditions</h2>
                            <p><em>Demo content - Configure Firebase to load actual terms</em></p>
                            
                            <h3>1. Plan Types and Features</h3>
                            <p>Roopam Jewellery offers various subscription plans with different features and pricing tiers to suit your needs.</p>
                            
                            <h3>2. Billing and Payment</h3>
                            <ul>
                                <li>All payments are processed securely through trusted payment gateways</li>
                                <li>Subscriptions automatically renew unless cancelled before the next billing cycle</li>
                                <li>All prices are inclusive of applicable taxes</li>
                                <li>Refunds are subject to our refund policy and applicable terms</li>
                            </ul>
                            
                            <h3>3. Plan Changes and Upgrades</h3>
                            <p>You may upgrade or downgrade your plan at any time. Changes take effect at the next billing cycle, and you'll be charged the difference in plan costs.</p>
                            
                            <h3>4. Cancellation Policy</h3>
                            <p>You may cancel your subscription at any time through your account settings. Access to premium features will continue until the end of your current billing period.</p>
                            
                            <h3>5. Service Availability and Uptime</h3>
                            <p>We strive to maintain 99.9% uptime but cannot guarantee uninterrupted service availability due to maintenance, updates, or unforeseen circumstances.</p>
                            
                            <h3>6. Fair Usage Policy</h3>
                            <p>All plans are subject to fair usage policies to ensure optimal performance for all users. Excessive usage may result in temporary limitations.</p>
                            
                            <h3>7. Plan-Specific Features</h3>
                            <p>Certain features are only available with specific plans. Please refer to our plan comparison page for detailed feature lists.</p>
                        `,
                        isActive: true,
                        createdAt: new Date(),
                        createdBy: 'System Administrator'
                    }
                };

                const termsData = demoTerms[category];
                if (termsData) {
                    this.termsCache.set(category, termsData);
                    this.displayTerms(category, termsData);
                } else {
                    this.showError(category, `Demo terms not available for ${category} category`);
                }
            }

            showLoading(panel) {
                panel.innerHTML = `
                    <div class="loading-state">
                        <div class="loading-spinner"></div>
                        <p>Loading terms and conditions...</p>
                    </div>
                `;
            }

            showError(category, message) {
                const panel = document.getElementById(`${category}-panel`);
                panel.innerHTML = `
                    <div class="error-state">
                        <i class="fas fa-exclamation-circle error-icon"></i>
                        <h3>Unable to Load Terms</h3>
                        <p>${message}</p>
                        <button class="retry-button" onclick="termsManager.retryLoad('${category}')">
                            <i class="fas fa-redo"></i> Try Again
                        </button>
                    </div>
                `;
            }

            async retryLoad(category) {
                this.retryCount = 0; // Reset retry count
                this.termsCache.delete(category);
                await this.loadTermsForCategory(category);
            }

            displayTerms(category, termsData) {
                const panel = document.getElementById(`${category}-panel`);
                
                // Format the creation date
                const createdDate = termsData.createdAt?.toDate?.() || new Date(termsData.createdAt);
                const formattedDate = createdDate.toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit'
                });

                panel.innerHTML = `
                    <div class="terms-rich-content">
                        ${this.processRichTextContent(termsData.content)}
                    </div>
                `;
            }

            processRichTextContent(content) {
                if (!content) {
                    return '<p>No content available.</p>';
                }

                // Check if content is Quill Delta format (array of operations)
                if (Array.isArray(content)) {
                    return this.convertQuillDeltaToHtml(content);
                }

                // Check if content is JSON string of Quill Delta
                if (typeof content === 'string' && content.startsWith('[')) {
                    try {
                        const deltaOps = JSON.parse(content);
                        if (Array.isArray(deltaOps)) {
                            return this.convertQuillDeltaToHtml(deltaOps);
                        }
                    } catch (e) {
                        console.warn('Failed to parse rich text content as JSON:', e);
                    }
                }

                // If content is already HTML, return as-is (with basic sanitization)
                if (content.includes('<') && content.includes('>')) {
                    return this.sanitizeHtml(content);
                }

                // If content is plain text, convert line breaks to paragraphs
                return content.split('\n\n').map(paragraph => 
                    paragraph.trim() ? `<p>${paragraph.replace(/\n/g, '<br>')}</p>` : ''
                ).join('');
            }

            convertQuillDeltaToHtml(deltaOps) {
                let html = '';
                let currentText = '';
                let isInParagraph = false;

                const flushText = () => {
                    if (currentText.trim()) {
                        if (!isInParagraph) {
                            html += '<p>';
                            isInParagraph = true;
                        }
                        html += currentText;
                        currentText = '';
                    }
                };

                const closeParagraph = () => {
                    if (isInParagraph) {
                        html += '</p>';
                        isInParagraph = false;
                    }
                };

                deltaOps.forEach((op, index) => {
                    if (op.insert) {
                        let text = op.insert;
                        
                        // Handle newlines
                        if (text.includes('\n')) {
                            const parts = text.split('\n');
                            
                            parts.forEach((part, partIndex) => {
                                if (part.trim()) {
                                    // Apply formatting attributes
                                    let formattedText = this.applyQuillFormatting(part, op.attributes || {});
                                    currentText += formattedText;
                                }
                                
                                // Handle newlines (except for the last empty part)
                                if (partIndex < parts.length - 1) {
                                    // Check if this is a paragraph break (double newline) or line break
                                    const nextPart = parts[partIndex + 1];
                                    if (!nextPart.trim() && partIndex < parts.length - 2) {
                                        // Double newline - paragraph break
                                        flushText();
                                        closeParagraph();
                                    } else {
                                        // Single newline - line break
                                        flushText();
                                        if (isInParagraph) {
                                            html += '<br>';
                                        }
                                    }
                                }
                            });
                        } else {
                            // No newlines, just apply formatting
                            let formattedText = this.applyQuillFormatting(text, op.attributes || {});
                            currentText += formattedText;
                        }
                    }
                });

                // Flush any remaining text
                flushText();
                closeParagraph();

                return html || '<p>No content available.</p>';
            }

            applyQuillFormatting(text, attributes) {
                let formatted = text;

                // Apply formatting attributes
                if (attributes.bold || attributes.b) {
                    formatted = `<strong>${formatted}</strong>`;
                }
                if (attributes.italic || attributes.i) {
                    formatted = `<em>${formatted}</em>`;
                }
                if (attributes.underline || attributes.u) {
                    formatted = `<u>${formatted}</u>`;
                }
                if (attributes.strike) {
                    formatted = `<s>${formatted}</s>`;
                }
                if (attributes.code) {
                    formatted = `<code>${formatted}</code>`;
                }
                if (attributes.link) {
                    formatted = `<a href="${attributes.link}" target="_blank" rel="noopener noreferrer">${formatted}</a>`;
                }
                if (attributes.color) {
                    formatted = `<span style="color: ${attributes.color}">${formatted}</span>`;
                }
                if (attributes.background) {
                    formatted = `<span style="background-color: ${attributes.background}">${formatted}</span>`;
                }

                // Handle headers
                if (attributes.header) {
                    const level = Math.min(Math.max(parseInt(attributes.header) || 1, 1), 6);
                    formatted = `<h${level}>${formatted}</h${level}>`;
                }

                // Handle lists (basic support)
                if (attributes.list) {
                    if (attributes.list === 'ordered') {
                        formatted = `<ol><li>${formatted}</li></ol>`;
                    } else {
                        formatted = `<ul><li>${formatted}</li></ul>`;
                    }
                }

                // Handle blockquote
                if (attributes.blockquote) {
                    formatted = `<blockquote>${formatted}</blockquote>`;
                }

                return formatted;
            }

            sanitizeHtml(html) {
                // Basic HTML sanitization - remove potentially dangerous tags
                let sanitized = html;
                
                // Remove script tags and their content
                sanitized = sanitized.replace(/<script[^>]*>.*?<\/script>/gis, '');
                
                // Remove on* event attributes
                sanitized = sanitized.replace(/\s*on\w+\s*=\s*["'][^"']*["']/gi, '');
                
                // Remove javascript: links
                sanitized = sanitized.replace(/href\s*=\s*["']javascript:[^"']*["']/gi, '');

                return sanitized;
            }
        }

        // Initialize Terms Manager
        window.termsManager = new TermsManager();
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
